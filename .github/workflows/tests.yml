name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the Lambda runtime — the version that actually matters.
        # 3.9 matches the local dev machine, so drift between the two surfaces
        # here rather than at deploy time.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # boto3 is the only dependency, and only because the handlers import it
        # at module scope. The tests themselves reach no AWS service.
        run: python -m pip install --quiet --upgrade pip boto3

      - name: Run test suites
        run: python tools/run_tests.py

      - name: Check handlers compile under the target runtime
        # A syntax error in a Lambda is only discovered at invoke time
        # otherwise — the console editor will happily save an unparseable file.
        run: python -m compileall -q lambdas/ tools/

  guard-secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fail if a credential or requirement doc was committed
        # This repo is public and the requirement PDF carries a live API token.
        # docs/ is gitignored, but an ignore rule is a convention and this is
        # an enforcement — a --force add or a rule edit would otherwise pass
        # unnoticed.
        run: |
          set -e
          fail=0

          if git ls-files --error-unmatch docs/ >/dev/null 2>&1; then
            echo "::error::docs/ is tracked - it contains a live API token"
            fail=1
          fi

          # Wistia tokens are 64 hex chars. Match the shape, not the value, so
          # this file never has to contain the secret it defends against.
          # Only this workflow is excluded, to avoid matching its own patterns;
          # tests and docs are deliberately in scope, since a token pasted into
          # a fixture or a markdown file leaks exactly as badly.
          if git grep -nIE '[0-9a-f]{64}' -- ':!.github/*' | grep -v 'sha256'; then
            echo "::error::possible API token committed (64-char hex string)"
            fail=1
          fi

          if git grep -nI 'hooks\.slack\.com/services/' -- ':!.github/*'; then
            echo "::error::Slack webhook URL committed"
            fail=1
          fi

          if git grep -nIE 'AKIA[0-9A-Z]{16}'; then
            echo "::error::AWS access key id committed"
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            echo "No credentials or requirement docs found in the tree."
          fi
          exit "$fail"
