<text x="40" y="485.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.1" fill="#E7157B">DESIGN NOTES</text>
<text x="40" y="505.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#93A1B0">• Send-then-mark-SENT: a duplicate page beats a missed lead, so the alert goes out before the ledger says it did.</text>
<text x="40" y="522.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#93A1B0">• The PENDING lease is sized to worst-case invocation time (~120s), not to the 10-minute business delay — that is already spent in the queue.</text>
<text x="40" y="539.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#93A1B0">• A missing owner is never negative-cached. It goes on the durable worklist, because “the next update will fix it” depends on an event that may never arrive.</text>
<text x="40" y="556.0" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#93A1B0">• Both Slack destinations read one SSM SecureString; unset means the alert is logged, never silently dropped.</text>
